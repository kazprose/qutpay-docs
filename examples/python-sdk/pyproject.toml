[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qutpay"
version = "0.1.0"
description = "Qut Pay клиенті: Kaspi QR счёттары, webhook қолтаңбасын тексеру (stdlib ғана)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

[tool.setuptools]
py-modules = ["qutpay"]
